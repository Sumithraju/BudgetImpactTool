# One command to a working instance: `docker compose up --build`.
#
# Three services. `db` holds the data, `migrate` brings the schema and the
# reference data up to date and then exits, and `api` and `ui` serve. The
# migration is a separate one-shot service rather than an entrypoint script on
# the API, so that a failed migration fails visibly and does not leave an API
# running against a schema it does not match.

# Outbound access, shared by the two services that need it.
#
# The API is not self-contained at request time: comparator discovery calls
# Open Targets and Reactome while serving a request, and ingestion calls the
# reference sources. Behind a corporate proxy, both fail — and discovery
# reports that failure as "we could not reach the drug database", which reads
# like an outage at the source rather than a proxy the container cannot see.
#
# Left empty by default and passed straight through from the host, so an unset
# variable stays unset: httpx ignores an empty proxy value and connects
# directly, so this costs nothing on a machine with no proxy.
# Host ports are overridable, and default to the same numbers as before.
#
# The three defaults collide with a local dev environment — `npm run dev` holds
# 5173, uvicorn holds 8077, and a developer PostgreSQL often holds 5433 — so
# running a container alongside the source checkout, or two copies of this
# project at once, failed to bind with nothing but a port message to explain
# it. Only the host side moves; inside the network the API is always api:8077,
# which is what nginx proxies to, so no other file needs to know.
#
#   BIET_UI_PORT=5273 BIET_API_PORT=8177 BIET_DB_PORT=5533 docker compose up --build
#
x-outbound: &outbound
  # httpx, in the API, reads the standard names — and only reads them at all
  # because the client leaves its transport to httpx (see comparator.py).
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  # data/ingestion/config.py reads the BIET_-prefixed pair instead.
  BIET_HTTP_PROXY: ${BIET_HTTP_PROXY:-}
  BIET_HTTPS_PROXY: ${BIET_HTTPS_PROXY:-}

services:
  db:
    # pgvector's own image: the guideline-citation search needs the extension,
    # and building it into the base postgres image at start-up is slower and
    # fails in less obvious ways.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: biet
      POSTGRES_PASSWORD: biet
      POSTGRES_DB: biet
    volumes:
      - biet-db:/var/lib/postgresql/data
    ports:
      # Exposed so you can point psql or a GUI at it. 5433 on the host to avoid
      # colliding with a PostgreSQL you may already run on 5432.
      - "${BIET_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biet -d biet"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *outbound
      BIET_DATABASE_URL: postgresql+psycopg://biet:biet@db:5432/biet
    depends_on:
      db:
        condition: service_healthy
    # Schema first, then the curated reference data. `--seed-only` is offline:
    # it reads the CSVs already in the image and makes no network call, so a
    # first run works on a machine with no internet.
    command: >-
      sh -c "cd /app/backend && alembic upgrade head &&
             cd /app && python -m data.ingestion.run --seed-only"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *outbound
      BIET_DATABASE_URL: postgresql+psycopg://biet:biet@db:5432/biet
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/corpus:/app/data/corpus:ro
    ports:
      - "${BIET_API_PORT:-8077}:8077"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIET_UI_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  biet-db:
