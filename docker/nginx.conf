server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The interface calls the API on the same origin, so nothing has to know a
    # second hostname and there is no CORS to configure. This mirrors what the
    # Vite dev server does with its proxy, which keeps dev and production
    # behaving the same way.
    location /api/ {
        proxy_pass         http://api:8077;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Exports and a large PSA can take a while; the default 60s cuts them off.
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8077/health;
    }

    # Hashed assets never change under their own name, so they cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
