[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biet-api"
version = "0.1.0"
description = "BIET — Budget Impact Estimation Tool: API and calculation engine"
requires-python = ">=3.12"

# Runtime dependencies are pinned in the repository-root requirements.txt so the
# ingestion package and the API resolve to one identical set. This file exists to
# make `biet_api` and `biet_engine` importable from a src layout.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
