[pytest]
testpaths = data/ingestion/tests backend/tests
python_files = test_*.py

# `network` marks the few tests that hit a live external API. Deselected by
# default so the standard run stays offline and deterministic; run them
# explicitly with `-m network` when verifying an upstream contract still
# holds.
markers =
    network: hits a live external API (deselected by default)

addopts = -q --strict-markers -m "not network"

# backend/src isn't reliably on sys.path via `pip install -e backend` on this
# interpreter (see STATUS.md section 5.2 — it silently skips .pth files), so
# it's added directly here rather than depended on via the editable install.
pythonpath = backend/src
