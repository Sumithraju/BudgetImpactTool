[pytest]
testpaths = data/ingestion/tests backend/tests
python_files = test_*.py
addopts = -q --strict-markers
# backend/src isn't reliably on sys.path via `pip install -e backend` on this
# interpreter (see STATUS.md section 5.2 — it silently skips .pth files), so
# it's added directly here rather than depended on via the editable install.
pythonpath = backend/src
